[project]
name = "legaldesk-api"
version = "1.0.0"
description = "FastAPI Backend for LegalDesk AI Enterprise Legal Operating System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "pyjwt[crypto]>=2.10.0",
    "passlib[argon2]>=1.7.4",
    "structlog>=24.4.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
